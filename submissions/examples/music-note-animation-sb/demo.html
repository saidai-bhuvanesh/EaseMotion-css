<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Note Animation</title>
    <link rel="stylesheet" href="style.css" />
    
  </head>
  <body>
    <main class="stage">
      <span class="stage__eyebrow">Demo</span>
      <h1 class="stage__title">Music Note Animation</h1>
      <p class="stage__subtitle">
        A self-contained demo for music note animation. Open this file directly in a
        browser — no server, CDN, or build step required.
      </p>
      <section class="card" aria-label="Music Note Animation">
                <div class="note note--anim" aria-hidden="true">🎵</div>
      </section>
      <p class="hint">Respects <code>prefers-reduced-motion</code>. No JavaScript required for the visual effect.</p>
    </main>
  </body>
</html>
