<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animated Toggle — Pastel</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="demo-shell">
      <section class="demo-card" aria-labelledby="tg-title">
        <p class="eyebrow">Input component</p>
        <h1 id="tg-title">Animated toggle with pastel styling</h1>
        <p class="demo-copy">Accessible checkbox-based toggles with a soft pastel knob, smooth slide + color transition, and three sizes.</p>
        <div class="tg-grid">
          <label class="tg tg--sm"><input type="checkbox" checked /><span class="tg-track"><span class="tg-knob"></span></span><span class="tg-text">Small</span></label>
          <label class="tg"><input type="checkbox" checked /><span class="tg-track"><span class="tg-knob"></span></span><span class="tg-text">Default</span></label>
          <label class="tg tg--lg"><input type="checkbox" /><span class="tg-track"><span class="tg-knob"></span></span><span class="tg-text">Large</span></label>
          <label class="tg tg--lilac"><input type="checkbox" checked /><span class="tg-track"><span class="tg-knob"></span></span><span class="tg-text">Lilac</span></label>
          <label class="tg tg--mint"><input type="checkbox" /><span class="tg-track"><span class="tg-knob"></span></span><span class="tg-text">Mint</span></label>
        </div>
      </section>
    </main>
  </body>
</html>
