<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Traffic Source Chart</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="shell">
      <section class="card" aria-labelledby="title">
        <p class="eyebrow">EaseMotion CSS</p>
        <h1 id="title">Traffic Source Chart</h1>
        <p class="copy">A horizontal bar chart of traffic sources with animated widths and percentages.</p>

        <ul class="chart" role="list">
          <li class="row" style="--target: 86%; --tone: #6366f1;">
            <span class="row__label">Organic search</span>
            <span class="row__track"><span class="row__bar"></span></span>
            <span class="row__value">86%</span>
          </li>
          <li class="row" style="--target: 64%; --tone: #22c55e;">
            <span class="row__label">Direct</span>
            <span class="row__track"><span class="row__bar"></span></span>
            <span class="row__value">64%</span>
          </li>
          <li class="row" style="--target: 47%; --tone: #f59e0b;">
            <span class="row__label">Social</span>
            <span class="row__track"><span class="row__bar"></span></span>
            <span class="row__value">47%</span>
          </li>
          <li class="row" style="--target: 31%; --tone: #ec4899;">
            <span class="row__label">Referral</span>
            <span class="row__track"><span class="row__bar"></span></span>
            <span class="row__value">31%</span>
          </li>
          <li class="row" style="--target: 18%; --tone: #06b6d4;">
            <span class="row__label">Email</span>
            <span class="row__track"><span class="row__bar"></span></span>
            <span class="row__value">18%</span>
          </li>
        </ul>
      </section>
    </main>
  </body>
</html>
