<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reply Quote Bubble</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="shell">
      <section class="card" aria-labelledby="title">
        <p class="eyebrow">EaseMotion CSS</p>
        <h1 id="title">Reply Quote Bubble</h1>
        <p class="copy">A chat bubble carrying a quoted reply excerpt above the message.</p>

        <div class="chat" role="list">
          <div class="bubble bubble--in" role="listitem">
            <span class="bubble__author">Priya</span>
            <p class="bubble__text">Did the deploy go out on staging?</p>
          </div>

          <div class="bubble bubble--out" role="listitem">
            <blockquote class="quote">
              <span class="quote__bar" aria-hidden="true"></span>
              <span class="quote__head">Priya</span>
              <p class="quote__text">Did the deploy go out on staging?</p>
            </blockquote>
            <p class="bubble__text">Yes — shipped at 14:02. Logs look clean.</p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
